<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Bloom - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; }
        .overlay { background: rgba(0, 0, 0, 0.6); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navigation Bar - Task 5 */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(0, 0, 0, 0.7); border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .logo { font-size: 28px; font-weight: bold; color: #00e676; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 18px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #00e676; }
        .search-container { display: flex; gap: 10px; }
        .search-container input { padding: 8px 15px; border-radius: 20px; border: none; outline: none; font-size: 14px; width: 220px; }
        .search-container button { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; }
        #btnSearch { background: #00e676; color: #000; }
        #btnSearch:hover { background: #00c853; }
        #btnClear { background: #ff5252; color: #fff; }
        #btnClear:hover { background: #d50000; }

        .main-container { display: flex; justify-content: space-between; padding: 60px 50px; gap: 40px; flex: 1; }
        .hero-text { max-width: 500px; }
        .hero-text h1 { font-size: 52px; margin-bottom: 20px; line-height: 1.2; }
        .hero-text p { font-size: 16px; line-height: 1.6; margin-bottom: 30px; color: #ddd; }

        .results-container { width: 450px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 10px; }
        .card { background: rgba(255, 255, 255, 0.95); color: #333; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 20px; }
        .card-content h3 { margin-bottom: 10px; font-size: 20px; color: #222; }
        .card-content p { font-size: 14px; color: #666; margin-bottom: 15px; line-height: 1.4; }
        .visit-btn { background: #00897b; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .visit-btn:hover { background: #00695c; }
        .error-msg, .no-results { background: rgba(255,255,255,0.8); color: #333; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="overlay">
    <nav class="navbar">
        <div class="logo">✈ Travel Bloom</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="search-container">
            <input type="text" id="conditionInput" placeholder="Enter a keyword (e.g. beach, temple, country)" aria-label="Search keyword">
            <button id="btnSearch">Search</button>
            <button id="btnClear">Clear</button>
        </div>
    </nav>

    <div class="main-container">
        <div class="hero-text">
            <h1>EXPLORE<br>DREAM<br>DESTINATION</h1>
            <p>Welcome to Travel Bloom! Your ultimate guide to finding the best destinations around the globe. Discover pristine beaches, ancient temples, and amazing countries for your next dream vacation.</p>
        </div>
        <div id="results" class="results-container"></div>
    </div>
</div>
<script src="travel_recommendation.js"></script>
</body>
</html>
