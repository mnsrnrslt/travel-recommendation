<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Bloom - Contact Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; }
        .overlay { background: rgba(0, 0, 0, 0.7); min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(0, 0, 0, 0.7); border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .logo { font-size: 28px; font-weight: bold; color: #00e676; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 18px; font-weight: 500; }
        .nav-links a:hover { color: #00e676; }
        .content { padding: 60px 100px; max-width: 800px; margin: 0 auto; }
        h1 { font-size: 42px; margin-bottom: 20px; color: #00e676; }
        .contact-form { background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 16px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: none; outline: none; font-size: 16px; }
        .form-group textarea { height: 120px; resize: vertical; }
        .submit-btn { background: #00e676; color: #000; border: none; padding: 12px 30px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #00c853; }
    </style>
</head>
<body>
<div class="overlay">
    <nav class="navbar">
        <div class="logo">✈ Travel Bloom</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>CONTACT US</h1>
        <p style="margin-bottom: 20px;">Have questions? Reach out to us via email or send us a message below.</p>
        <p style="margin-bottom: 30px;"><strong>Email:</strong> contact@travelbloom.com</p>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Your Name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Your Email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>
</div>
</body>
</html>
